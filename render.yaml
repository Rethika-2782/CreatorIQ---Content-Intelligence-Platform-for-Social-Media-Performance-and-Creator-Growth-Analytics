services:
  - type: web
    name: creatoriq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: python start.py
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./creatoriq_dev.db
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_USERS
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
